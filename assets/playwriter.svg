<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    
    <clipPath id="hexClip">
      <polygon points="100,4 183.14,52 183.14,148 100,196 16.86,148 16.86,52" />
    </clipPath>

    <clipPath id="innerHexClip">
      <polygon points="100,11 177.08,55.5 177.08,144.5 100,189 22.92,144.5 22.92,55.5" />
    </clipPath>

    <clipPath id="viewportClip">
      <rect x="47" y="73" width="106" height="63" rx="4" />
    </clipPath>

    
    <radialGradient id="bgRadial" cx="50%" cy="38%" r="65%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#241b4b" />
      <stop offset="55%" stop-color="#11162d" />
      <stop offset="100%" stop-color="#080b18" />
    </radialGradient>

    <linearGradient id="hexRimOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="hexRimInner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>

    
    <radialGradient id="centerGlow" cx="50%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#8b5cf6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080b18" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="browserShell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="browserHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b485e" />
      <stop offset="100%" stop-color="#273244" />
    </linearGradient>

    <linearGradient id="screenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d1a" />
    </linearGradient>

    
    <linearGradient id="playMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="55%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <linearGradient id="playFacetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8fa3" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ff4d6d" stop-opacity="0.1" />
    </linearGradient>

    
    <linearGradient id="nibGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="nibShadow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="penBarrel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="45%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="penCollar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    
    <linearGradient id="trailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#fde68a" stop-opacity="1" />
    </linearGradient>

    
    <pattern id="techGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#94a3b8" stroke-width="0.4" stroke-opacity="0.09" />
      <circle cx="0" cy="0" r="0.7" fill="#a855f7" fill-opacity="0.18" />
    </pattern>

    
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#020617" flood-opacity="0.65" />
    </filter>

    <filter id="neonGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <polygon points="100,4 183.14,52 183.14,148 100,196 16.86,148 16.86,52" fill="url(#bgRadial)" />

  
  <g clip-path="url(#innerHexClip)">
    <rect x="0" y="0" width="200" height="200" fill="url(#techGrid)" />
    <circle cx="100" cy="102" r="85" fill="url(#centerGlow)" />

    
    <polygon points="100,11 177.08,55.5 100,72 22.92,55.5" fill="#ffffff" opacity="0.03" />
    <polygon points="100,189 177.08,144.5 100,128 22.92,144.5" fill="#000000" opacity="0.22" />

    
    <g fill="none" stroke-linecap="round">
      
      <path d="M 22,82 L 34,82 L 42,90" stroke="#a855f7" stroke-width="1.2" opacity="0.55" />
      <path d="M 22,118 L 34,118 L 42,110" stroke="#38bdf8" stroke-width="1.2" opacity="0.55" />
      <circle cx="34" cy="82" r="2" fill="#a855f7" opacity="0.85" />
      <circle cx="34" cy="118" r="2" fill="#38bdf8" opacity="0.85" />

      
      <path d="M 178,82 L 166,82 L 158,90" stroke="#a855f7" stroke-width="1.2" opacity="0.55" />
      <path d="M 178,118 L 166,118 L 158,110" stroke="#38bdf8" stroke-width="1.2" opacity="0.55" />
      <circle cx="166" cy="82" r="2" fill="#a855f7" opacity="0.85" />
      <circle cx="166" cy="118" r="2" fill="#38bdf8" opacity="0.85" />

      
      <line x1="100" y1="16" x2="100" y2="44" stroke="url(#hexRimOuter)" stroke-width="1.2" opacity="0.45" />
      <circle cx="100" cy="24" r="2.2" fill="#c084fc" opacity="0.8" />
      <line x1="100" y1="156" x2="100" y2="184" stroke="url(#hexRimOuter)" stroke-width="1.2" opacity="0.45" />
      <circle cx="100" cy="176" r="2.2" fill="#38bdf8" opacity="0.8" />
    </g>
  </g>

  
  <polygon points="100,4 183.14,52 183.14,148 100,196 16.86,148 16.86,52" fill="none" stroke="url(#hexRimOuter)" stroke-width="2.5" stroke-linejoin="round" />
  <polygon points="100,11 177.08,55.5 177.08,144.5 100,189 22.92,144.5 22.92,55.5" fill="none" stroke="url(#hexRimInner)" stroke-width="0.9" stroke-linejoin="round" />

  
  <g filter="url(#dropShadow)">
    
    <rect x="43" y="52" width="114" height="88" rx="8" fill="url(#browserShell)" stroke="#64748b" stroke-width="1" />

    
    <path d="M 43.5,60 A 7.5,7.5 0 0 1 51,52.5 L 149,52.5 A 7.5,7.5 0 0 1 156.5,60 L 156.5,69 L 43.5,69 Z" fill="url(#browserHeader)" />
    <line x1="43.5" y1="69" x2="156.5" y2="69" stroke="#475569" stroke-width="0.8" />

    
    <circle cx="53" cy="60.75" r="2.6" fill="#ff5f56" />
    <circle cx="62" cy="60.75" r="2.6" fill="#ffbd2e" />
    <circle cx="71" cy="60.75" r="2.6" fill="#27c93f" />

    
    <rect x="81" y="56.5" width="66" height="8.5" rx="4.25" fill="#0f172a" stroke="#475569" stroke-width="0.6" />
    <circle cx="86.5" cy="60.75" r="1.5" fill="#38bdf8" opacity="0.85" />
    <line x1="91" y1="60.75" x2="124" y2="60.75" stroke="#64748b" stroke-width="1.3" stroke-linecap="round" />

    
    <rect x="47" y="73" width="106" height="63" rx="4" fill="url(#screenBg)" />
  </g>

  
  <g clip-path="url(#viewportClip)">
    
    <g stroke-linecap="round" opacity="0.32">
      <line x1="53" y1="82" x2="68" y2="82" stroke="#a855f7" stroke-width="2" />
      <line x1="56" y1="89" x2="75" y2="89" stroke="#38bdf8" stroke-width="1.8" />
      <line x1="56" y1="96" x2="65" y2="96" stroke="#94a3b8" stroke-width="1.8" />
      <line x1="56" y1="115" x2="72" y2="115" stroke="#38bdf8" stroke-width="1.8" />
      <line x1="53" y1="122" x2="66" y2="122" stroke="#a855f7" stroke-width="2" />
    </g>

    
    <path d="M 52,129 C 72,129 82,118 112,113" fill="none" stroke="url(#trailGrad)" stroke-width="2" stroke-linecap="round" filter="url(#softGlow)" />

    
    <g filter="url(#neonGlow)">
      
      <polygon points="83,84 83,123 117,103.5" fill="url(#playMain)" stroke="#fda4af" stroke-width="0.9" stroke-linejoin="round" />
      
      <polygon points="83,84 117,103.5 94,103.5" fill="url(#playFacetTop)" />
      
      <line x1="83" y1="84" x2="94" y2="103.5" stroke="#ffffff" stroke-width="0.6" opacity="0.45" />
    </g>
  </g>

  
  <g transform="translate(113, 112) rotate(38)" filter="url(#dropShadow)">
    
    <g filter="url(#softGlow)">
      <path d="M 0,-6 L 1.2,-1.2 L 6,0 L 1.2,1.2 L 0,6 L -1.2,1.2 L -6,0 L -1.2,-1.2 Z" fill="#fef08a" />
    </g>

    
    <path d="M 0,0 L -9.5,18 L -6.5,27 L 6.5,27 L 9.5,18 Z" fill="url(#nibGold)" stroke="#fef3c7" stroke-width="0.6" stroke-linejoin="round" />
    
    <path d="M 0,0 L 0,27 L 6.5,27 L 9.5,18 Z" fill="url(#nibShadow)" opacity="0.45" />
    
    <line x1="0" y1="1.5" x2="0" y2="15" stroke="#451a03" stroke-width="1.1" stroke-linecap="round" />
    <circle cx="0" cy="16.5" r="1.8" fill="#451a03" />

    
    <rect x="-7.5" y="27" width="15" height="4.5" rx="1.2" fill="url(#penCollar)" stroke="#e9d5ff" stroke-width="0.5" />

    
    <path d="M -6.5,31.5 L 6.5,31.5 L 5.5,56 L -5.5,56 Z" fill="url(#penBarrel)" stroke="#cbd5e1" stroke-width="0.5" />
    
    <line x1="-6" y1="36" x2="6" y2="36" stroke="#334155" stroke-width="1" />
    <line x1="-5.8" y1="39.5" x2="5.8" y2="39.5" stroke="#334155" stroke-width="1" />

    
    <rect x="-5.5" y="56" width="11" height="4" rx="1.5" fill="#1e293b" stroke="#94a3b8" stroke-width="0.5" />
  </g>
</svg>
